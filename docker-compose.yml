version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ragam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ragam_bahasa_db}
      MYSQL_USER: ${MYSQL_USER:-rana_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secure_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragam-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragam-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://rana_user:secure_password@mysql:3306/ragam_bahasa_db}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production-make-it-long-and-random}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      DEBUG: ${DEBUG:-True}
    ports:
      - "8069:8069"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    networks:
      - ragam-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8069 --reload

  # React Frontend with Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragam-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ragam-network

# Networks
networks:
  ragam-network:
    driver: bridge

# Volumes
volumes:
  mysql_data:
    driver: local
