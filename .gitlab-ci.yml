stages:
  - test
  - mirror
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  RAILWAY_STATIC_URL: "https://railway.app"

# Test stage (optional but recommended)
test:backend:
  stage: test
  image: python:3.11-slim
  before_script:
    - cd backend
    - pip install -r requirements.txt
  script:
    - echo "Running backend tests..."
    # Add your test commands here
    # - pytest tests/
  only:
    - merge_requests
    - main
    - feature/integrated

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🔄 AUTO-MIRROR: GitLab → GitHub
# This job automatically syncs GitLab to GitHub
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
mirror:github:
  stage: mirror
  image: alpine/git
  before_script:
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
  script:
    - echo "Mirroring branch $CI_COMMIT_BRANCH to GitHub..."
    # Add GitHub remote
    - git remote add github https://${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git 2>/dev/null || true
    # Force push to GitHub
    - git push github HEAD:$CI_COMMIT_BRANCH --force
    - echo "✅ Successfully mirrored to GitHub!"
  only:
    - main
    - feature/integrated

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🚀 DEPLOY: Railway (Optional - via CLI)
# Note: Railway will auto-deploy from GitHub anyway
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Deploy to Railway via CLI (manual trigger)
deploy:railway-cli:
  stage: deploy
  image: node:18-alpine
  before_script:
    - npm install -g @railway/cli
  script:
    - echo "Deploying to Railway from branch $CI_COMMIT_BRANCH"
    - railway link $RAILWAY_PROJECT_ID
    - railway up
  when: manual
  only:
    - main
    - feature/integrated
  environment:
    name: production
    url: $RAILWAY_APP_URL

# Note: Railway auto-deploy job
# Railway will automatically deploy when GitHub is updated
# No manual Railway CLI deployment needed!
