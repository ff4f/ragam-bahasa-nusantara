stages:
  - test
  - mirror

# Test stage (optional but recommended)
test:backend:
  stage: test
  image: python:3.11-slim
  before_script:
    - cd backend
    - pip install -r requirements.txt
  script:
    - echo "Running backend tests..."
    # Add your test commands here
    # - pytest tests/
  only:
    - merge_requests
    - main
    - feature/integrated

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🔄 AUTO-MIRROR: GitLab → GitHub
# This job automatically syncs GitLab to GitHub
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
mirror:github:
  stage: mirror
  image: alpine:latest
  variables:
    GIT_DEPTH: 0
  script:
    - echo "Mirroring branch $CI_COMMIT_BRANCH to GitHub..."
    - apk add --no-cache git
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
    - git remote add github https://${GITHUB_TOKEN}@github.com/ff4f/ragam-bahasa-nusantara.git 2>/dev/null || true
    - git push github HEAD:refs/heads/$CI_COMMIT_BRANCH --force
    - echo "✅ Successfully mirrored to GitHub!"
  only:
    - main
    - feature/integrated

# Railway will automatically deploy when GitHub is updated via mirror job above
# No manual deployment needed!
